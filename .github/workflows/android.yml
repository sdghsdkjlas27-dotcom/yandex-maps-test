name: Yandex Maps on Android Emulator

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search query"
        required: false
        default: "АЗС"
      query_b64:
        description: "Search query, base64 UTF-8 (takes precedence over query; avoids encoding issues)"
        required: false
        default: "0JDQl9Ch"
      latitude:
        description: "Latitude to set as GPS location"
        required: false
        default: "55.079"
      longitude:
        description: "Longitude to set as GPS location"
        required: false
        default: "38.778"

jobs:
  yandex-maps-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download Yandex Maps APK
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          PAGE="https://apk.gold/download?file_id=2940825/yandex-maps"

          echo "=== resolving direct APK url from $PAGE ==="
          curl -sSL --retry 3 --retry-delay 5 --connect-timeout 30 -A "$UA" "$PAGE" -o page.html
          ls -la page.html

          B64=$(grep -oP '(?<=&b=)[A-Za-z0-9+/=]+' page.html | head -n1)
          if [ -z "${B64:-}" ]; then
            echo "::error::signed download link not found on page"
            exit 1
          fi
          URL=$(printf '%s' "$B64" | base64 -d)
          echo "direct url: $URL"

          echo "=== downloading APK ==="
          curl -L --retry 3 --retry-delay 5 --connect-timeout 30 -A "$UA" "$URL" -o YandexMaps.apk \
            -w "http=%{http_code} size=%{size_download}\n"
          ls -la YandexMaps.apk

      - name: Verify APK
        run: |
          set -euo pipefail
          echo "=== file type ==="
          file YandexMaps.apk

          echo "=== sha256 ==="
          echo "5a3cfdfc7135591247af156c6731471351c107e6cf510298b47b0bbe064f864b  YandexMaps.apk" | sha256sum -c -

          echo "=== native libs ==="
          unzip -l YandexMaps.apk | grep -q 'lib/x86_64/' || { echo "::error::APK has no x86_64 native libs"; exit 1; }

      - name: Run emulator, install Yandex Maps, set GPS, search, screenshot
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          QUERY: ${{ inputs.query }}
          QUERY_B64: ${{ inputs.query_b64 }}
          LAT: ${{ inputs.latitude }}
          LON: ${{ inputs.longitude }}
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # NOTE: android-emulator-runner executes `script` line-by-line via `sh -c`,
          # so shell functions / multi-line constructs are NOT allowed here.
          # The full scenario lives in scripts/run_scenario.sh (real bash).
          script: bash scripts/run_scenario.sh

      - name: Validate results
        run: |
          set -e
          ls -la screenshot.png || true
          SIZE=$(stat -c%s screenshot.png 2>/dev/null || echo 0)
          echo "screenshot size: $SIZE bytes"
          if [ "$SIZE" -lt 10240 ]; then
            echo "::error::screenshot.png is missing or too small"
            exit 1
          fi
          python3 - <<'EOF'
          import json, sys
          with open("result.json", encoding="utf-8") as f:
              r = json.load(f)
          print("success:", r.get("success"), "| results:", len(r.get("results", [])))
          if not r.get("success"):
              sys.exit("::error::result.json reports success=false")
          EOF

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yandex-maps-result
          path: |
            screenshot.png
            result.json
            window.xml
            ui_map.xml
            logcat.txt
            dumpsys_location.txt
            01_maps_started.png
            02_location_set.png
            03_search_opened.png
            04_search_results.png
          if-no-files-found: warn
