name: Yandex Maps on Android Emulator

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search query"
        required: false
        default: "АЗС"
      latitude:
        description: "Latitude to set as GPS location"
        required: false
        default: "55.079"
      longitude:
        description: "Longitude to set as GPS location"
        required: false
        default: "38.778"

jobs:
  yandex-maps-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download Yandex Maps APK
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          PAGE="https://apk.gold/download?file_id=2940825/yandex-maps"

          echo "=== resolving direct APK url from $PAGE ==="
          curl -sSL --retry 3 --retry-delay 5 --connect-timeout 30 -A "$UA" "$PAGE" -o page.html
          ls -la page.html

          B64=$(grep -oP '(?<=&b=)[A-Za-z0-9+/=]+' page.html | head -n1)
          if [ -z "${B64:-}" ]; then
            echo "::error::signed download link not found on page"
            exit 1
          fi
          URL=$(printf '%s' "$B64" | base64 -d)
          echo "direct url: $URL"

          echo "=== downloading APK ==="
          curl -L --retry 3 --retry-delay 5 --connect-timeout 30 -A "$UA" "$URL" -o YandexMaps.apk \
            -w "http=%{http_code} size=%{size_download}\n"
          ls -la YandexMaps.apk

      - name: Verify APK
        run: |
          set -euo pipefail
          echo "=== file type ==="
          file YandexMaps.apk

          echo "=== sha256 ==="
          echo "5a3cfdfc7135591247af156c6731471351c107e6cf510298b47b0bbe064f864b  YandexMaps.apk" | sha256sum -c -

          echo "=== native libs ==="
          unzip -l YandexMaps.apk | grep -q 'lib/x86_64/' || { echo "::error::APK has no x86_64 native libs"; exit 1; }

      - name: Run emulator, install Yandex Maps, set GPS, search, screenshot
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          QUERY: ${{ inputs.query }}
          LAT: ${{ inputs.latitude }}
          LON: ${{ inputs.longitude }}
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e

            dump_ui() {
              for i in 1 2 3 4; do
                adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1
                adb pull /sdcard/window.xml . >/dev/null 2>&1
                if [ -s window.xml ]; then return 0; fi
                sleep 3
              done
              return 1
            }

            echo "### params: query=$QUERY lat=$LAT lon=$LON"

            echo "=== adb devices ==="
            adb devices

            echo "=== enable location, set GPS before app start ==="
            adb shell settings put secure location_mode 3 2>/dev/null
            adb emu geo fix "$LON" "$LAT"
            sleep 3

            echo "=== install ADBKeyboard (for Cyrillic input) ==="
            adb install -r ADBKeyboard.apk
            adb shell ime enable com.android.adbkeyboard/.AdbIME

            echo "=== launch ru.yandex.yandexmaps ==="
            adb shell monkey -p ru.yandex.yandexmaps 1
            echo "=== waiting 45s for app to load ==="
            sleep 45

            echo "=== diagnostics: packages / activities ==="
            adb shell pm list packages | grep yandex || true
            adb shell dumpsys activity activities | grep -i yandex || true

            adb exec-out screencap -p > 01_maps_started.png
            dump_ui && cp window.xml ui_map.xml || true

            echo "=== set GPS again while app is running + verify ==="
            adb emu geo fix "$LON" "$LAT"
            sleep 10
            adb shell dumpsys location > dumpsys_location.txt 2>&1
            LAT_HITS=$(grep -c "$LAT" dumpsys_location.txt || true)
            LON_HITS=$(grep -c "$LON" dumpsys_location.txt || true)
            echo "location verification: lat hits=$LAT_HITS lon hits=$LON_HITS"
            if [ "${LAT_HITS:-0}" -gt 0 ] && [ "${LON_HITS:-0}" -gt 0 ]; then
              GPS_VERIFIED=true
            else
              GPS_VERIFIED=false
            fi
            echo "GPS_VERIFIED=$GPS_VERIFIED"
            adb exec-out screencap -p > 02_location_set.png

            echo "=== step A/B: find and tap search field ==="
            SEARCH_METHOD=uiautomator
            if dump_ui && python3 scripts/find_search.py window.xml > center.txt 2> find_search.log; then
              cat find_search.log || true
              read -r CX CY < center.txt
              echo "tapping search field at ($CX,$CY)"
              adb shell input tap "$CX" "$CY"
              sleep 4
            else
              echo "search field not found via uiautomator, will use deep link fallback"
              SEARCH_METHOD=deeplink
            fi
            adb exec-out screencap -p > 03_search_opened.png

            echo "=== step C/D: type query and submit ==="
            if [ "$SEARCH_METHOD" = "uiautomator" ]; then
              adb shell ime set com.android.adbkeyboard/.AdbIME
              sleep 1
              B64=$(printf '%s' "$QUERY" | base64 -w0)
              adb shell am broadcast -a ADB_INPUT_B64 --es msg "$B64"
              sleep 3
              dump_ui || true
              if grep -q "$QUERY" window.xml 2>/dev/null; then
                echo "query text confirmed in UI"
                adb shell input keyevent 66
              else
                echo "query NOT visible after typing, falling back to deep link"
                SEARCH_METHOD=deeplink
              fi
            fi

            if [ "$SEARCH_METHOD" = "deeplink" ]; then
              ENC=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['QUERY']))")
              adb shell am start -a android.intent.action.VIEW -d "yandexmaps://maps.yandex.ru/?text=$ENC"
            fi

            echo "=== step E: waiting for results ==="
            sleep 15
            dump_ui || true
            adb exec-out screencap -p > 04_search_results.png
            cp window.xml window.xml 2>/dev/null || true

            echo "=== step F: extract results ==="
            SEARCH_METHOD=$SEARCH_METHOD GPS_VERIFIED=$GPS_VERIFIED \
              python3 scripts/extract.py window.xml result.json
            cat result.json || true

            echo "=== final artifacts ==="
            cp 04_search_results.png screenshot.png
            adb logcat -d > logcat.txt
            ls -la screenshot.png result.json window.xml logcat.txt

      - name: Validate results
        run: |
          set -e
          ls -la screenshot.png || true
          SIZE=$(stat -c%s screenshot.png 2>/dev/null || echo 0)
          echo "screenshot size: $SIZE bytes"
          if [ "$SIZE" -lt 10240 ]; then
            echo "::error::screenshot.png is missing or too small"
            exit 1
          fi
          python3 - <<'EOF'
          import json, sys
          with open("result.json", encoding="utf-8") as f:
              r = json.load(f)
          print("success:", r.get("success"), "| results:", len(r.get("results", [])))
          if not r.get("success"):
              sys.exit("::error::result.json reports success=false")
          EOF

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yandex-maps-result
          path: |
            screenshot.png
            result.json
            window.xml
            ui_map.xml
            logcat.txt
            dumpsys_location.txt
            01_maps_started.png
            02_location_set.png
            03_search_opened.png
            04_search_results.png
          if-no-files-found: warn
